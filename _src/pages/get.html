<section class="page" style="text-align:center">
<img src="/img/icon-192.png" alt="" width="110" height="110" style="margin:0 auto 10px;border-radius:26px;border:4px solid #3a1f5c">
<h1>{{get_h1}}</h1>
<p class="meta" id="get-msg" data-opening="{{get_opening}}" data-choose="{{get_choose}}">{{get_soon}}</p>
<div style="display:flex;justify-content:center;margin:18px 0">{{BADGES}}</div>
<p>{{get_demo}}</p>
<p style="margin-top:18px"><img src="/img/qr-get.svg" alt="{{qr_alt}}" width="150" height="150" style="margin:0 auto;background:#fff;border-radius:14px;border:3px solid #3a1f5c;padding:6px"></p>
</section>
<script>
// Smart link: sends a phone straight to its store once the links exist.
(function(){var s={{STORES_JSON}},u=navigator.userAgent||'',m=document.getElementById('get-msg');
var ios=/iPhone|iPad|iPod/.test(u)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),and=/Android/.test(u);
var to=ios?s.ios:and?s.android:'';
if(to){m.textContent=m.getAttribute('data-opening');setTimeout(function(){if(window.edgTrack)edgTrack('get_redirect',{store:ios?'ios':'android'});location.replace(to)},150)}
else if(s.ios||s.android){m.textContent=m.getAttribute('data-choose')}})();
</script>
